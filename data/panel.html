function renamePreset(scope,id,chip){const group=state.presets.scopes[scope],item=group?.entries.find(e=>e.id===id),sourceName=state.selectedSource;if(!state.hasFilter||!item||chip.querySelector('input'))return;const input=document.createElement('input');input.className='preset-rename';input.setAttribute('aria-label','预设名称，最多5个字');input.value=item.name;input.maxLength=5;chip.replaceChildren(input);let finished=false;const finish=cancel=>{if(finished)return;finished=true;if(sourceName!==state.selectedSource||!state.hasFilter)return;const current=state.presets.scopes?.[scope]?.entries.find(e=>e.id===id);if(!current)return;const value=input.value.trim();if(!cancel&&value&&value.length<=5){current.name=value;render();schedule(true);}else{if(!cancel&&!value)notice('预设名称不能为空');render();}};input.onclick=e=>e.stopPropagation();input.ondblclick=e=>e.stopPropagation();input.onblur=()=>finish(false);input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();finish(false);}else if(e.key==='Escape'){e.preventDefault();finish(true);}};input.focus();input.select();}
function deletePreset(scope,id){if(!state.hasFilter)return;const group=state.presets.scopes[scope],item=group?.entries.find(e=>e.id===id);if(!item)return;if(group.entries.length<=1)return notice('至少保留1个预设，暂不支持删除');confirmAction({title:id===group.active_id?'删除当前预设后，将默认应用首个预设，请谨慎操作。是否继续删除？':'确认删除'+item.name+'？',message:'只删除此页的预设，其他页面的配置保留。',confirmText:'删除',onConfirm:()=>{syncActivePresets();const current=state.presets.scopes[scope];const remaining=current.entries.filter(e=>e.id!==id);if(!remaining.length)return;if(current.active_id===id){comparisonEnd();current.active_id=remaining[0].id;mergeScope(remaining[0].selection,scope);state.focus='';}current.entries=remaining;render();schedule(true);}});}
function presetSection(content){ensurePresets();const scope=state.page,group=state.presets.scopes[scope],section=document.createElement('section');section.className='preset-section';section.dataset.scope=scope;const title=document.createElement('div');title.className='preset-title';const label=document.createElement('span');label.textContent='预设';title.append(label,resetButton());const list=document.createElement('div');list.className='preset-list';list.setAttribute('aria-label','本页预设');for(const item of group.entries){const chip=document.createElement('div');chip.className='preset-chip'+(group.active_id===item.id?' selected':'')+(!state.hasFilter?' disabled':'');chip.dataset.presetId=item.id;const select=button(item.name,'preset-select',()=>switchPreset(scope,item.id));select.disabled=!state.hasFilter;select.setAttribute('aria-pressed',String(group.active_id===item.id));select.title='双击重命名，最多5个字';select.ondblclick=()=>renamePreset(scope,item.id,chip);const remove=button('×','preset-delete');remove.onclick=e=>{e.stopPropagation();deletePreset(scope,item.id);};remove.setAttribute('aria-label','删除'+item.name);remove.title=group.entries.length<=1?'至少保留1个预设':'删除预设';remove.disabled=!state.hasFilter;chip.append(select,remove);list.append(chip);}if(group.entries.length<15){const add=button('添加预设','preset-add',()=>addPreset(scope));const plus=document.createElement('span');plus.textContent='+';plus.setAttribute('aria-hidden','true');add.prepend(plus);add.disabled=!state.hasFilter;list.append(add);}section.append(title,list);content.append(section);const divider=document.createElement('div');divider.className='divider preset-divider';divider.setAttribute('role','separator');divider.setAttribute('aria-label','预设分割线');content.append(divider);}
function resetPage(){if(!state.hasFilter)return;const page=state.page,panels=page==='effectall'?presetScopes.effectall:page==='makeup'?presetScopes.makeup:['composerfilter'];confirmAction({title:'确定清空本页效果？',message:page==='effectall'?'将清空本页美颜、美型和美体效果。其他页面及其他预设保留。':page==='makeup'?'将清空本页妆容。其他页面及其他预设保留。':'将清空本页滤镜效果，其他页面保留。',confirmText:'清空',onConfirm:()=>{const ids=lookup();state.selection.items=state.selection.items.filter(e=>!panels.includes(ids.get(e.id)?.panel));state.focus='';render();schedule(true);}});}
function resetButton(){const reset=button('清空效果','text-button',resetPage);reset.prepend(Object.assign(document.createElement('span'),{className:'reset-icon',textContent:'↺'}));reset.disabled=!state.hasFilter;return reset;}
function ensure(i){let active=entry(i.id);if(active)return active;const ids=lookup();state.selection.items=state.selection.items.filter(e=>!conflicts(i,ids.get(e.id)||{}));active={id:i.id,values:defaults(i)};state.selection.items.push(active);state.selection.disabled_panels=(state.selection.disabled_panels||[]).filter(p=>p!==i.panel);return active;}
function select(i){if(!state.hasFilter||!available(i))return;ensure(i);state.focus=i.id;render();schedule(true);}
function remove(ids){state.selection.items=state.selection.items.filter(e=>!ids.includes(e.id));render();schedule(true);}
function togglePanel(panel,on){let disabled=new Set(state.selection.disabled_panels||[]);if(on)disabled.delete(panel);else disabled.add(panel);state.selection.disabled_panels=[...disabled];render();schedule(true);}
function icon(url,size){const el=document.createElement('img');el.alt='';if(url)el.src=url;else el.style.visibility='hidden';el.onerror=()=>el.style.visibility='hidden';return el;}
function sectionTitle(name,panel){const title=document.createElement('div');title.className='section-title';const sw=document.createElement('input');sw.type='checkbox';sw.className='switch';sw.checked=enabledPanel(panel);sw.disabled=!state.hasFilter;sw.setAttribute('aria-label','开启'+name);sw.onchange=()=>togglePanel(panel,sw.checked);const text=document.createElement('span');text.textContent=name;title.append(sw,text);return title;}
function control(i,c,{label='',inline=false}={}){const el=document.createElement('div');el.className='control';el.dataset.itemId=i.id;el.dataset.tag=c.tag;if(label){const text=document.createElement('span');text.className='control-label';text.textContent=label;text.title=label;el.append(text);}const range=document.createElement('input');range.type='range';range.className='range';range.min=c.min??0;range.max=c.max??100;range.step=1;range.setAttribute('aria-label',(i.original_name||i.name)+' '+(c.name||'强度'));const number=document.createElement('input');number.type='number';number.className='number';number.min=range.min;number.max=range.max;number.step=1;number.setAttribute('aria-label',range.getAttribute('aria-label')+'数值');let value=entry(i.id)?.values[c.tag]??Math.max(Number(range.min),Math.min(Number(range.max),0));range.value=number.value=value;const paint=()=>{const fraction=(Number(range.value)-Number(range.min))/(Number(range.max)-Number(range.min)||1);range.style.backgroundSize=(Math.max(0,Math.min(1,fraction))*100)+'% 100%';};paint();range.disabled=number.disabled=!state.hasFilter||!available(i)||!enabledPanel(i.panel);const update=sender=>{let v=Number(sender.value);if(!Number.isFinite(v))return;v=Math.max(Number(range.min),Math.min(Number(range.max),v));const active=ensure(i);active.values[c.tag]=v;document.querySelectorAll('.control').forEach(other=>{if(other.dataset.itemId!==i.id||other.dataset.tag!==c.tag)return;const r=other.querySelector('.range'),n=other.querySelector('.number');if(r){r.value=v;const fraction=(v-Number(r.min))/(Number(r.max)-Number(r.min)||1);r.style.backgroundSize=(Math.max(0,Math.min(1,fraction))*100)+'% 100%';}if(n)n.value=v;});state.focus=i.id;schedule();};range.oninput=()=>update(range);number.onchange=()=>update(number);number.oninput=()=>{if(number.value!==''&&Number(number.value)>=Number(range.min)&&Number(number.value)<=Number(range.max))update(number);};el.append(range,number);if(!inline){const reset=button('↺','clear-row',()=>{const active=entry(i.id);if(active)active.values[c.tag]=0;range.value=number.value=Math.max(Number(range.min),Math.min(Number(range.max),0));paint();schedule(true);});reset.title='此参数归零';reset.disabled=!state.hasFilter;el.append(reset);}return el;}
function renderRow(row,container){const map=lookup(),groups=row.groups.map(g=>({...g,members:g.members.map(id=>map.get(id)).filter(Boolean)})).filter(g=>g.members.length);if(!groups.length)return;const expanded=!!state.expanded[row.id];const choose=g=>g.members.find(i=>entry(i.id))||g.members[0];const main=choose(groups[0]);const hasExtras=groups.length>1||groups[0].members.length>1||(main.controls||[]).length>1;const line=document.createElement('div');line.className='row'+(!available(main)?' unavailable':'');line.dataset.rowId=row.id;const title=document.createElement('div');title.className='row-title';title.append(icon(row.icon_url||main.icon_url));const name=document.createElement('span');name.className='label';name.textContent=row.name;name.title=row.name;title.append(name);if(hasExtras){const arrow=button(expanded?'▴':'▾','disclosure',()=>{state.expanded[row.id]=!expanded;render();});arrow.setAttribute('aria-label',(expanded?'收起':'展开')+row.name+'子项');arrow.setAttribute('aria-expanded',expanded);title.append(arrow);}const controls=document.createElement('div');controls.className='row-controls';if(main.controls?.length)controls.append(control(main,main.controls[0]));else{const note=document.createElement('span');note.className='help';note.textContent=reason(main);controls.append(note);}line.append(title,controls);container.append(line);if(!available(main)){const why=document.createElement('div');why.className='reason';why.textContent=reason(main);container.append(why);}if(expanded){const extra=document.createElement('div');extra.className='extras';for(let n=0;n<groups.length;n++){const group=groups[n],selected=choose(group);if(group.members.length>1){const modes=document.createElement('div');modes.className='modes';for(const member of group.members){const label=document.createElement('label');label.className='mode'+(member.id===selected.id?' active':'');const radio=document.createElement('input');radio.type='radio';radio.name=row.id+'-'+n;radio.checked=member.id===selected.id;radio.disabled=!state.hasFilter||!available(member);radio.onchange=()=>select(member);label.append(radio,document.createTextNode(member.original_name||member.name));modes.append(label);}extra.append(modes);}for(const [ci,c]of(selected.controls||[]).entries()){if(n===0&&ci===0)continue;extra.append(control(selected,c,{label:c.name||selected.original_name||'强度'}));}}container.append(extra);}}
function historical(group,represented){const items=state.catalog.items.filter(i=>i.group_id===group&&!i.hidden&&!represented.has(i.id));if(!items.length)return null;const detail=document.createElement('details');detail.className='historical';detail.open=items.some(i=>entry(i.id));const summary=document.createElement('summary');summary.textContent='更多项目（'+items.length+'）';detail.append(summary);for(const i of items)renderRow({id:'extra:'+i.id,name:i.name,groups:[{members:[i.id]}]},detail);return detail;}
function effectPage(content){const rows=state.catalog.ui_rows||[],represented=new Set(rows.flatMap(r=>r.groups.flatMap(g=>g.members)));const basic=document.createElement('section');basic.className='section';basic.append(sectionTitle('美颜','effect'));const body=document.createElement('div');body.className='section-body'+(!enabledPanel('effect')?' off':'');for(const row of rows.filter(r=>r.group_id==='beauty'))renderRow(row,body);basic.append(body);const more=historical('beauty',represented);if(more)basic.append(more);content.append(basic);const divider=document.createElement('div');divider.className='divider';content.append(divider);const shape=document.createElement('section');shape.className='section';const head=document.createElement('div');head.className='fold-title';const fold=button(state.expanded.shape===false?'▸':'▾','',()=>{state.expanded.shape=state.expanded.shape===false;render();});head.append(fold,document.createTextNode('整形'));shape.append(head);if(state.expanded.shape!==false){const shapeRows=rows.filter(r=>r.group_id==='shape'),categories=[...new Map(shapeRows.map(r=>[r.category_id,r.category_name])).entries()];if(!categories.some(([id])=>id===state.category))state.category=categories[0]?.[0]||'';const tabs=document.createElement('div');tabs.className='group-tabs';for(const[id,name]of categories)tabs.append(button(name,id===state.category?'active':'',()=>{state.category=id;render();}));shape.append(tabs);for(const row of shapeRows.filter(r=>r.category_id===state.category))renderRow(row,shape);const more=historical('shape',represented);if(more)shape.append(more);}content.append(shape);const bodySection=document.createElement('section');bodySection.className='section';bodySection.append(sectionTitle('美体','slim'));const bodyRows=document.createElement('div');bodyRows.className='section-body'+(!enabledPanel('slim')?' off':'');for(const row of rows.filter(r=>r.group_id==='body'))renderRow(row,bodyRows);bodySection.append(bodyRows);const bodyMore=historical('body',represented);if(bodyMore)bodySection.append(bodyMore);content.append(bodySection);}
function card(item,action){const el=button('','card'+(item&&entry(item.id)?' active':'')+(item&&!available(item)?' unavailable':''),action);el.dataset.itemId=item?.id||'';const circle=document.createElement('span');circle.className='icon';if(item?.icon_url)circle.append(icon(item.icon_url));else{const fallback=document.createElement('span');fallback.className='fallback';fallback.textContent=item?(item.original_name||item.name).slice(0,1):'⊘';circle.append(fallback);}const name=document.createElement('span');name.className='name';name.textContent=item?.original_name||item?.name||'无';el.title=item&&!available(item)?item.name+'：'+reason(item):name.textContent;if(!item)el.classList.add('none');el.append(circle,name);return el;}
function inlineParams(item){const panel=document.createElement('div');panel.className='inline-panel';panel.dataset.activeItem=item.id;if(!available(item)){const text=document.createElement('div');text.className='help';text.textContent=reason(item);panel.append(text);return panel;}for(const c of item.controls||[])panel.append(control(item,c,{label:c.name||'强度',inline:true}));if(!item.controls?.length){const p=document.createElement('div');p.className='help';p.textContent='此效果暂无可调整参数。';panel.append(p);}return panel;}
// CSS and the inline parameter row use one column count at every dock width.
function gridColumns(){return Number.parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-columns'),10)||7;}
function relayoutGrids(){const columns=gridColumns();document.querySelectorAll('.grid').forEach(el=>{const panel=el.querySelector(':scope > .inline-panel');if(!panel)return;const cells=[...el.children].filter(e=>e.classList.contains('card')),index=cells.findIndex(e=>e.dataset.itemId===panel.dataset.activeItem);if(index<0)return;const end=Math.min(cells.length-1,(Math.floor(index/columns)+1)*columns-1),next=cells[end].nextElementSibling;if(next===panel)return;const focus=panel.contains(document.activeElement)?document.activeElement:null;el.insertBefore(panel,next);focus?.focus({preventScroll:true});});}
window.addEventListener('resize',relayoutGrids);
function grid(items,{panel,none=true,limit=0}={}){const columns=gridColumns();const el=document.createElement('div');el.className='grid';const shown=limit?items.slice(0,limit):items;let active=shown.find(i=>i.id===state.focus&&entry(i.id))||shown.find(i=>entry(i.id));const cells=[];if(none){const empty=card(null,()=>remove(items.map(i=>i.id)));if(!items.some(i=>entry(i.id)))empty.classList.add('active');cells.push(empty);}for(const i of shown)cells.push(card(i,()=>{if(!available(i)){state.focus=i.id;render();return;}select(i);}));if(limit&&items.length>limit){const more=card({id:'__more',name:'展开更多',original_name:'展开更多',installed:true,node_path:'ui-only'},()=>{state.styleExpanded=true;render();});more.classList.remove('unavailable');more.querySelector('.fallback').textContent='+'+(items.length-limit);cells.push(more);}const focusedUnavailable=shown.find(i=>i.id===state.focus&&!available(i));if(focusedUnavailable)active=focusedUnavailable;let activeIndex=active?cells.findIndex(c=>c.dataset.itemId===active.id):-1;for(let n=0;n<cells.length;n++){el.append(cells[n]);if(active&&((n+1)%columns===0||n===cells.length-1)&&n>=activeIndex&&n-columns+1<=activeIndex){el.append(inlineParams(active));active=null;}}return el;}
function makeupPage(content){for(const[panel,title]of[['makeupstyle','风格整妆'],['makeupsingle','自定义美妆']]){const section=document.createElement('section');section.className='section';section.append(sectionTitle(title,panel));const body=document.createElement('div');body.className='section-body'+(!enabledPanel(panel)?' off':'');const items=state.catalog.items.filter(i=>i.panel===panel&&!i.hidden).sort((a,b)=>(a.ui_order??1e9)-(b.ui_order??1e9));if(panel==='makeupstyle'){body.append(grid(items,{panel,limit:state.styleExpanded?0:12}));if(state.styleExpanded&&items.length>12)body.append(button('⌃ 收起','text-button collapse',()=>{state.styleExpanded=false;render();}));}else{const partOrder=state.catalog.ui_part_order?.[panel]||[];const rank=name=>{const index=partOrder.indexOf(name);return index<0?1e9:index;};const parts=[...new Set(items.map(i=>i.parent_name||i.category_name))].sort((a,b)=>rank(a)-rank(b));for(const name of parts){const part=document.createElement('div');part.className='part';const label=document.createElement('h3');label.className='part-title';label.textContent=name;part.append(label,grid(items.filter(i=>(i.parent_name||i.category_name)===name),{panel}));body.append(part);}}section.append(body);content.append(section);if(panel==='makeupstyle'){const divider=document.createElement('div');divider.className='divider';content.append(divider);}}}
function filterPage(content){const section=document.createElement('section');section.className='section';section.append(sectionTitle('滤镜','composerfilter'));const body=document.createElement('div');body.className='section-body'+(!enabledPanel('composerfilter')?' off':'');body.append(grid(state.catalog.items.filter(i=>i.group_id==='composerfilter'&&!i.hidden),{panel:'composerfilter'}));section.append(body);content.append(section);}
function render(){const scroll=$('content').scrollTop;document.querySelectorAll('.sidebar button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));const c=$('content');c.replaceChildren();const camera=document.createElement('div');camera.className='camera';camera.append(document.createTextNode('摄像头：'));const name=document.createElement('span');name.textContent=state.selectedSource||'未选择来源';camera.append(name);c.append(camera);if(presetScopes[state.page])presetSection(c);else{const title=document.createElement('div');title.className='topline';const heading=document.createElement('strong');heading.textContent='滤镜设置';title.append(heading,resetButton());c.append(title);const divider=document.createElement('div');divider.className='divider';divider.style.marginTop='0';c.append(divider);}if(!state.hasFilter){const help=document.createElement('p');help.className='off-notice';help.textContent='先在顶部将直播美颜添加到视频来源。';c.append(help);}if(state.page==='effectall')effectPage(c);else if(state.page==='makeup')makeupPage(c);else filterPage(c);c.scrollTop=scroll;updateHost();}
function updateHost(){const select=$('source');const names=[...select.options].map(o=>o.value);if(JSON.stringify(names)!==JSON.stringify(state.sources)){select.replaceChildren(...(state.sources.length?state.sources.map(n=>new Option(n,n)):[new Option('OBS 中尚无视频来源','')]));}select.value=state.selectedSource;$('add').textContent=state.hasFilter?'已添加':'添加美颜';$('add').disabled=state.hasFilter||!state.sources.length;$('enabled').checked=state.enabled;$('enabled').disabled=!state.hasFilter;$('compare').disabled=!state.hasFilter||!state.enabled;$('compare').classList.toggle('comparing',!!state.comparing);$('compare').textContent=state.comparing?'原画对比中':'按住对比';$('resources').title=state.resourceRoot||'选择资源目录';$('status').textContent=state.comparing?'正在查看原画，松开恢复效果':state.status||'选择效果后即可调整。';}
function comparisonStart(event){if(press||!state.hasFilter||!state.enabled)return;event.preventDefault();press=true;if(event.pointerId!=null)$('compare').setPointerCapture(event.pointerId);state.comparing=true;updateHost();bridge('beginComparison',{sourceName:state.selectedSource});}
function comparisonEnd(){if(!press&&!state.comparing)return;press=false;state.comparing=false;bridge('endComparison');updateHost();}
const equal=(a,b)=>JSON.stringify(a.disabled_panels||[])===JSON.stringify(b.disabled_panels||[])&&a.items.length===b.items.length&&a.items.every((e,n)=>e.id===b.items[n].id&&Object.keys(e.values).length===Object.keys(b.items[n].values).length&&Object.keys(e.values).every(k=>Number(e.values[k])===Number(b.items[n].values[k])));
window.LiveBeauty={receive(message){if(message.type==='state'){promptCloser?.();comparisonEnd();Object.assign(state,message);state.catalog=message.catalog||{items:[],ui_rows:[]};state.selection=message.selection||{version:1,items:[],disabled_panels:[]};state.selection.disabled_panels??=[];ensurePresets();render();}else if(message.type==='status'){state.status=message.status;$('status-dot').classList.toggle('ready',message.ready);updateHost();}else if(message.type==='applied'){if(message.sourceName!==state.selectedSource||message.revision!==selectionRevision)return;if(message.presets)state.presets=message.presets;if(!equal(state.selection,message.selection)){state.selection=message.selection;render();}}else if(message.type==='comparison'){state.comparing=!!message.active;if(!message.active)press=false;updateHost();}},getState(){return structuredClone(state);}};
document.querySelectorAll('.sidebar button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.focus='';$('content').scrollTop=0;render();});$('source').onchange=()=>{const name=$('source').value;promptCloser?.();comparisonEnd();clearTimeout(timer);bridge('selectSource',{name});};$('refresh').onclick=()=>{comparisonEnd();clearTimeout(timer);bridge('refreshSources');};$('add').onclick=()=>bridge('addFilter');$('enabled').onchange=()=>{const enabled=$('enabled').checked;comparisonEnd();state.enabled=enabled;bridge('setEnabled',{enabled:state.enabled});updateHost();};$('resources').onclick=()=>bridge('chooseResourceRoot');$('compare').onpointerdown=comparisonStart;for(const event of['pointerup','pointercancel','lostpointercapture'])$('compare').addEventListener(event,comparisonEnd);$('compare').onkeydown=e=>{if([' ','Enter'].includes(e.key)&&!e.repeat)comparisonStart(e);};$('compare').onkeyup=e=>{if([' ','Enter'].includes(e.key))comparisonEnd();};window.addEventListener('blur',comparisonEnd);window.addEventListener('pagehide',comparisonEnd);document.addEventListener('visibilitychange',()=>{if(document.hidden)comparisonEnd();});updateHost();bridge('ready');})();
</script></body></html>
